name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick > /dev/null
      - name: client game test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest
      - name: capture game test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Screenshots
          path: build/run/clientGameTest/screenshots
          if-no-files-found: ignore
