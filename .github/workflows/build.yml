name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: api probe
        if: ${{ hashFiles('probe.txt') != '' }}
        continue-on-error: true
        run: |
          ./gradlew --no-daemon dependencies --configuration compileClasspath > /dev/null || true
          ./gradlew --no-daemon compileJava -x compileClientJava > /dev/null 2>&1 || true
          JAR=$(find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -i 'minecraft' | grep -iv 'sources' | xargs ls -S 2>/dev/null | head -1)
          echo "PROBE_JAR=$JAR"
          find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -i minecraft | head -20
          while read -r cls; do
            [ -z "$cls" ] && continue
            echo "===== $cls"
            javap -cp "$JAR" -p "$cls" 2>&1 | grep -v 'private static final' | grep -v 'lambda\$'
          done < probe.txt
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
