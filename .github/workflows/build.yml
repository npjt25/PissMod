name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: api probe
        if: ${{ hashFiles('probe.txt') != '' }}
        continue-on-error: true
        run: |
          ./gradlew --no-daemon compileJava -x compileClientJava > /dev/null 2>&1 || true
          CP=$(find ~/.gradle -name 'minecraft-*-deobf-*.jar' | grep -v sources | tr '\n' ':')
          echo "PROBE_CP=$CP"
          while IFS='|' read -r cls pat; do
            [ -z "$cls" ] && continue
            echo "===== $cls"
            javap -cp "$CP" -p "$cls" 2>&1 | grep -v 'private ' | grep -v 'lambda\$' | grep -E "$pat" | sed 's/^/P| /'
          done < probe.txt
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
