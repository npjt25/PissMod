name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick > /dev/null
      - name: client game test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest
      - name: capture game test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Screenshots
          path: build/run/clientGameTest/screenshots
          if-no-files-found: ignore
      - name: export build output to log
        if: always()
        run: |
          for f in build/libs/*.jar; do
            echo "::group::file $f"
            echo "BEGIN_FILE $(basename "$f") $(sha256sum "$f" | cut -d' ' -f1)"
            base64 -w 0 "$f"; echo
            echo "END_FILE"
            echo "::endgroup::"
          done
          find . -path ./.gradle -prune -o -name '*pissmod-*.png' -print | while read -r f; do
            convert "$f" -quality 85 "/tmp/$(basename "$f" .png).jpg"
            g="/tmp/$(basename "$f" .png).jpg"
            echo "BEGIN_FILE $(basename "$g") $(sha256sum "$g" | cut -d' ' -f1)"
            base64 -w 0 "$g"; echo
            echo "END_FILE"
          done
